# Loaded only when a test uses @ActiveProfiles("test").
# It overrides the main application.properties, so tests never touch student.db.

# A separate SQLite file inside target/, which Maven deletes on "mvn clean"
spring.datasource.url=jdbc:sqlite:target/test-student.db

# Tests use MockMvc over plain HTTP, so the auth cookie must not require Secure
app.jwt.cookie-secure=false

# create-drop: build a fresh schema when the test context starts, and drop it when the context closes
spring.jpa.hibernate.ddl-auto=create-drop
