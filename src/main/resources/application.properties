# ---------------------------------------------------------------
# SQLite database connection
# ---------------------------------------------------------------

# JDBC URL. The file is created on first connection, relative to the folder you start the app from.
# Running "mvn spring-boot:run" from the project folder puts student.db in the project root.
spring.datasource.url=jdbc:sqlite:student.db

# Class name of the JDBC driver (provided by the sqlite-jdbc jar)
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite handles one writer at a time. A single connection avoids "database is locked" errors.
spring.datasource.hikari.maximum-pool-size=1

# ---------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------

# Hibernate must know the SQL dialect. Hibernate 6 cannot detect SQLite on its own.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# update: create missing tables and columns at startup, keep existing data.
# Fine for learning. In production, use versioned migration scripts (Flyway or Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update

# Print every SQL statement Hibernate runs. Useful for learning, turn off later.
spring.jpa.show-sql=true

# Pretty-print the logged SQL across several lines
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------
# JWT authentication
# ---------------------------------------------------------------

# How long a login lasts, in minutes. Organization standard: 15 to 60.
app.jwt.expiry-minutes=30

# Send the auth cookie only over HTTPS. Browsers and curl ignore Secure cookies on plain HTTP,
# so set this to false only for local HTTP testing.
app.jwt.cookie-secure=true

# ---------------------------------------------------------------
# First user accounts (created at startup if they don't exist yet)
# ---------------------------------------------------------------
# Set these environment variables before starting the app. Each password must be at least 8 characters.
# If a variable is empty, that account is skipped with a warning.
#   SEED_ADMIN_PASSWORD     → user "admin"    (role ADMIN)
#   SEED_HR_PASSWORD        → user "hr_user"  (role HR)
#   SEED_EMPLOYEE_PASSWORD  → user "employee" (role EMPLOYEE)
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.hr-password=${SEED_HR_PASSWORD:}
app.seed.employee-password=${SEED_EMPLOYEE_PASSWORD:}

# Stop Spring from keeping the database session open during web requests.
# Services should own transactions, and this prevents accidental lazy-loading in controllers.
spring.jpa.open-in-view=false
